<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DMP CS データ管理ツール</title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>

<body>

  <header class="header">

    <h1>
      DMP CS データ管理ツール
    </h1>

    <nav class="menu">

      <button
        id="menu-participants"
        class="menu-button active"
      >
        参加表明
      </button>

      <button
        id="menu-results"
        class="menu-button"
      >
        大会結果
      </button>

      <button
        id="menu-events"
        class="menu-button"
      >
        大会一覧
      </button>

    </nav>

  </header>


  <main class="container">


    <!-- ============================== -->
    <!-- 参加表明ページ -->
    <!-- ============================== -->

    <div
      id="page-participants"
      class="page"
    >

      <h2>
        参加表明者を取得
      </h2>

      <label for="event-url">
        大会URL
      </label>

      <div class="input-area">

        <input
          type="text"
          id="event-url"
          placeholder="https://www.dmp-ranking.com/event.asp?..."
        >

        <button id="get-event">
          参加者を取得
        </button>

        <button id="reset">
          リセット
        </button>

      </div>


      <section id="event-info">

        <h2>
          イベント情報
        </h2>

        <p>
          ShopID：
          <span id="shop-id">-</span>
        </p>

        <p>
          EventID：
          <span id="event-id">-</span>
        </p>

        <p>
          Seq：
          <span id="seq">-</span>
        </p>

        <p>
          参加者一覧URL：
          <a
            id="participant-url"
            href="#"
            target="_blank"
          >
            -
          </a>
        </p>

      </section>


      <section id="participants">

        <h2>
          参加表明者
        </h2>

        <p id="participant-count">
          取得件数：0人
        </p>

        <table>

          <thead>

            <tr>
              <th>ID</th>
              <th>ハンドルネーム</th>
              <th>過去の使用デッキ</th>
            </tr>

          </thead>

          <tbody id="participant-list">
          </tbody>

        </table>

      </section>

    </div>



    <!-- ============================== -->
    <!-- 大会結果ページ -->
    <!-- ============================== -->

    <div
      id="page-results"
      class="page"
      style="display: none;"
    >

      <h2>
        大会結果を取得
      </h2>

      <label for="result-url">
        大会詳細URL
      </label>

      <div class="input-area">

        <input
          type="text"
          id="result-url"
          placeholder="https://www.dmp-ranking.com/event.asp?..."
        >

        <button id="get-result">
          大会結果を取得
        </button>

        <button id="result-reset">
          リセット
        </button>

      </div>


      <section id="result-info">

        <h2>
          大会結果情報
        </h2>

        <p>
          Year：
          <span id="result-year">-</span>
        </p>

        <p>
          ShopID：
          <span id="result-shop-id">-</span>
        </p>

        <p>
          EventID：
          <span id="result-event-id">-</span>
        </p>

        <p>
          開催回：
          <span id="result-held">-</span>
        </p>

      </section>


      <section id="results">

        <h2>
          大会結果参加者
        </h2>

        <p id="result-count">
          取得件数：0人
        </p>

        <table>

          <thead>

            <tr>
              <th>順位</th>
              <th>ID</th>
              <th>ハンドルネーム</th>
              <th>実際の使用デッキ</th>
              <th>保存</th>
            </tr>

          </thead>

          <tbody id="result-list">
          </tbody>

        </table>

      </section>

    </div>



    <!-- ============================== -->
    <!-- 大会一覧ページ -->
    <!-- ============================== -->

    <div
      id="page-events"
      class="page"
      style="display: none;"
    >

      <div class="page-title-row">

        <div>

          <h2>
            大会一覧
          </h2>

          <p class="page-description">
            保存されている大会を確認できます。
          </p>

        </div>

        <button id="reload-events">
          更新
        </button>

      </div>


      <section id="events">

        <p id="event-count">
          保存大会数：0件
        </p>

        <div class="table-scroll">

          <table>

            <thead>

              <tr>
                <th>開催日</th>
                <th>大会名</th>
                <th>参加人数</th>
                <th>ShopID</th>
                <th>EventID</th>
                <th>Seq</th>
              </tr>

            </thead>

            <tbody id="event-list">
            </tbody>

          </table>

        </div>

      </section>

    </div>


  </main>


  <script src="script.js"></script>

</body>
</html>
